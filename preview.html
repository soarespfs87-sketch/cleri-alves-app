<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview Cleri Alves</title>
  <link rel="icon" type="image/png" href="assets/logo-mark.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --creme:  #F1EEEC;
      --chai:   #E6D7C9;
      --salmao: #D5B2A7;
      --latte:  #A48F86;
      --ink:    #402F29;
      --shell:  #2b2320;   /* moldura dos aparelhos */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 24px 64px;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(90% 50% at 50% 0%, #FBF9F8, var(--creme) 70%);
    }

    header { text-align: center; margin-bottom: 44px; }
    header img.mark {
      width: 64px;
      height: auto;
      display: block;
      margin: 0 auto 14px;
    }
    header h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: 26px;
      letter-spacing: 0.02em;
      color: var(--latte);
    }
    header p {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--latte);
    }
    header .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--chai);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #5c4a44;
    }
    header .live::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--salmao);
      box-shadow: 0 0 0 4px rgba(213, 178, 167, 0.35);
    }

    .stage {
      display: flex;
      flex-wrap: wrap;
      gap: 44px;
      justify-content: center;
      align-items: flex-start;
    }
    .device { display: flex; flex-direction: column; align-items: center; }
    .device__label {
      margin-bottom: 14px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--latte);
    }

    /* ---------- celular ---------- */
    .phone {
      width: 390px;
      max-width: 92vw;
      height: 720px;
      max-height: 78vh;
      background: var(--shell);
      border-radius: 46px;
      padding: 14px;
      box-shadow: 0 30px 60px -20px rgba(64, 47, 41, 0.45);
    }
    .phone__screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      background: #fff;
    }
    .phone__notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 128px; height: 26px;
      background: var(--shell);
      border-radius: 0 0 16px 16px;
      z-index: 2;
    }

    /* ---------- computador ---------- */
    .desktop {
      width: 900px;
      max-width: 92vw;
      background: var(--shell);
      border-radius: 14px 14px 0 0;
      padding: 12px 12px 0;
      box-shadow: 0 30px 60px -20px rgba(64, 47, 41, 0.45);
    }
    .desktop__bar {
      display: flex;
      gap: 7px;
      padding: 2px 4px 12px;
    }
    .desktop__bar span {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: #6b5c55;
    }
    .desktop__screen {
      width: 100%;
      height: 560px;
      max-height: 72vh;
      background: #fff;
      border-radius: 6px 6px 0 0;
      overflow: hidden;
    }
    .desktop__stand {
      width: 150px; height: 16px;
      margin: 0 auto;
      background: #3a2f2a;
      border-radius: 0 0 7px 7px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <img class="mark" src="assets/logo-mark.png" alt="Cleri Alves" />
    <h1>preview</h1>
    <p>O mesmo app, ao vivo, no celular e no computador ao mesmo tempo.</p>
    <span class="live">app real e clicável, o que você mudar aparece nos dois</span>
  </header>

  <div class="stage">
    <div class="device">
      <span class="device__label">Celular</span>
      <div class="phone">
        <div class="phone__screen">
          <div class="phone__notch"></div>
          <iframe src="http://localhost:8000/index.html" title="Cleri Alves no celular"></iframe>
        </div>
      </div>
    </div>

    <div class="device">
      <span class="device__label">Computador</span>
      <div class="desktop">
        <div class="desktop__bar"><span></span><span></span><span></span></div>
        <div class="desktop__screen">
          <iframe src="http://localhost:8000/index.html" title="Cleri Alves no computador"></iframe>
        </div>
      </div>
      <div class="desktop__stand"></div>
    </div>
  </div>
</body>
</html>
